name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset windows-ci-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config Release --parallel

      - name: Install
        run: cmake --install build_x64 --prefix release --config Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $archive = "$($spec.name)-$($spec.version)-windows-x64.zip"
          Remove-Item "release/$($spec.name)/bin/64bit/*.pdb" -ErrorAction SilentlyContinue
          Compress-Archive -Path "release/$($spec.name)" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: obs-exit-button-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "${{ steps.package.outputs.archive }}"
          "${{ steps.package.outputs.archive }}.sha256"
          --verify-tag
          --generate-notes
          --title "OBS Exit Button ${{ github.ref_name }}"
        shell: pwsh
